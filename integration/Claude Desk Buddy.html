<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Desk Buddy — /buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Claude warm palette — tuned for a lit LCD */
    --paper:#e7e1d3;          /* desk / board */
    --paper-2:#ddd6c4;
    --ink:#2b2722;            /* dark pixels */
    --ink-soft:#5a5249;
    --lcd:#e9e1cf;           /* lit cream screen */
    --lcd-2:#e3dac6;
    --coral:#d97757;          /* Claude coral */
    --coral-lite:#e9a883;
    --clay:#b5532f;
    --alert:#c0492b;          /* maxed / 100% */
    --ghost:rgba(43,39,34,.10);
    --bezel:#171513;
    --bezel-2:#241f1b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #efe9dc 0%, var(--paper) 55%, var(--paper-2) 100%);
    color:var(--ink);
    font-family:"Space Mono",monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:46px 40px 60px;
  }

  /* ---------- presentation board ---------- */
  .board{max-width:1010px;margin:0 auto;}
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:42px;}
  .masthead h1{font-family:"Silkscreen",monospace;font-weight:700;font-size:26px;line-height:1;margin:0;letter-spacing:.5px;}
  .masthead h1 .slash{color:var(--coral);}
  .masthead .sub{font-size:12px;color:var(--ink-soft);text-align:right;line-height:1.7;letter-spacing:.3px;}
  .masthead .sub b{color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:54px 48px;justify-items:center;}

  .card{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;}
  .caption{width:412px;display:flex;gap:14px;align-items:flex-start;}
  .caption .num{font-family:"Silkscreen",monospace;font-weight:700;font-size:13px;color:var(--coral);padding-top:2px;}
  .caption .body .name{font-family:"Silkscreen",monospace;font-weight:700;font-size:13px;letter-spacing:.4px;margin-bottom:6px;}
  .caption .body .desc{font-size:12px;line-height:1.55;color:var(--ink-soft);max-width:330px;text-wrap:pretty;}

  /* ---------- device bezel (M5Stack Core2) ---------- */
  .device{
    position:relative;width:412px;height:392px;border-radius:30px;
    background:linear-gradient(160deg,var(--bezel-2),var(--bezel) 60%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 -2px 6px rgba(0,0,0,.5) inset,
      0 26px 50px -18px rgba(40,30,20,.55),
      0 4px 10px rgba(0,0,0,.25);
  }
  /* power LED */
  .device .led{position:absolute;top:18px;left:24px;width:7px;height:7px;border-radius:50%;
    background:#46c06a;box-shadow:0 0 6px #46c06a, 0 0 1px #0a3;}
  .device .brand{position:absolute;top:15px;right:26px;font-family:"Space Mono",monospace;font-weight:700;
    font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.20);}

  .screen-wrap{position:absolute;top:40px;left:46px;width:320px;height:240px;border-radius:5px;
    background:#000;padding:0;
    box-shadow:0 0 0 3px #0c0a09, 0 0 0 4px rgba(255,255,255,.04),
      0 6px 14px rgba(0,0,0,.45) inset;}

  /* three capacitive touch zones */
  .touch{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:46px;}
  .touch i{width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #2a2521, #141210);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 1px 2px rgba(0,0,0,.5);}
  .touch i::after{content:"";position:absolute;}

  /* ---------- the 320x240 LCD ---------- */
  .screen{
    position:relative;width:320px;height:240px;border-radius:4px;overflow:hidden;
    background:
      radial-gradient(130% 120% at 30% 0%, var(--lcd) 0%, var(--lcd-2) 100%);
    font-family:"Silkscreen",monospace;color:var(--ink);
  }
  /* dot-matrix LCD grain */
  .screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    background-image:radial-gradient(rgba(43,39,34,.05) 0.9px, transparent 1px);
    background-size:3px 3px;}
  /* glass sheen */
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;
    background:linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 70%, rgba(255,255,255,.05) 100%);
    box-shadow:0 0 22px rgba(43,39,34,.18) inset;}

  .screen .stack{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;}

  /* header 18px */
  .hdr{height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:space-between;
    padding:0 8px;border-bottom:1px dashed rgba(43,39,34,.16);}
  .hdr .id{font-size:8px;letter-spacing:.5px;}
  .hdr .id .s{color:var(--coral);}
  .hdr .conn{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--ink-soft);}
  .hdr .dot{width:7px;height:7px;border-radius:50%;}
  .hdr .dot.on{background:var(--coral);box-shadow:0 0 5px rgba(217,119,87,.8);}
  .hdr .dot.off{background:transparent;border:1.5px solid rgba(43,39,34,.4);}

  /* content 160px */
  .content{flex:0 0 160px;display:flex;align-items:center;gap:8px;padding:0 12px;}
  .mascot-wrap{position:relative;flex:0 0 112px;height:112px;}
  .mascot{display:grid;grid-template-columns:repeat(16,7px);grid-auto-rows:7px;line-height:0;}
  .mascot .px{width:7px;height:7px;}

  .status{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .status .kicker{font-size:8px;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:-2px;}
  .status .big{font-size:17px;font-weight:700;letter-spacing:.5px;line-height:1;}
  .status .big.time{letter-spacing:1px;text-shadow:0 0 6px rgba(192,73,43,.25);}
  .status .sub{font-size:8px;line-height:1.5;color:var(--ink-soft);letter-spacing:.3px;}
  .status .sub.accent{color:var(--clay);}
  .status .sub .hl{color:var(--ink);}

  /* deco bits over mascot */
  .deco{position:absolute;inset:0;pointer-events:none;}
  .deco .z{position:absolute;font-size:8px;color:rgba(43,39,34,.45);}
  .deco .spark{position:absolute;width:5px;height:5px;background:var(--coral);
    box-shadow:0 0 5px rgba(217,119,87,.7);}
  .deco .drop{position:absolute;width:5px;height:7px;border-radius:0 0 50% 50%/0 0 60% 60%;
    background:var(--lcd);border:1.5px solid var(--ink);border-top:none;}

  /* footer 62px */
  .ftr{flex:0 0 62px;display:flex;flex-direction:column;justify-content:center;gap:9px;
    padding:0 12px;border-top:1px dashed rgba(43,39,34,.16);}
  .bar-row{display:flex;align-items:center;gap:8px;}
  .bar-row .lbl{font-size:8px;width:22px;letter-spacing:.5px;color:var(--ink-soft);}
  .bar{flex:1;display:flex;gap:2px;height:10px;}
  .bar .seg{flex:1;background:var(--ghost);}
  .bar .seg.f{background:var(--coral);}
  .bar .seg.f.alert{background:var(--alert);}
  .bar .seg.lead{background:var(--coral-lite);}
  .bar-row .val{font-size:8px;width:30px;text-align:right;letter-spacing:.3px;}
  .bar-row .val.alert{color:var(--alert);}

  /* offline = dim, low-contrast LCD */
  .screen.off .stack{opacity:.52;filter:grayscale(.35);}
</style>
</head>
<body>
  <div class="board">
    <div class="masthead">
      <h1><span class="slash">/</span>claudebuddy</h1>
      <div class="sub">
        <b>Claude Desk Buddy</b> &middot; M5Stack Core2<br>
        320 &times; 240 &middot; warm-LCD &middot; four states
      </div>
    </div>
    <div class="grid" id="board"></div>
  </div>

<script>
/* ============================================================
   ORIGINAL PIXEL MASCOT  ("Clawd"-inspired, swappable)
   Single 16x16 map + per-state face overlays.
   Edit BODY / FACES to redraw — everything else regenerates.
   ============================================================ */
const PALETTE = {
  '.':null,
  K:'#2b2722',   // ink outline
  C:'#d97757',   // coral fill
  L:'#ecb087',   // highlight
  D:'#b5532f',   // shadow
  W:'#f6efe0',   // eye white
  P:'#2b2722',   // pupil
  R:'#cf6a49'    // blush
};

const BODY = [
  "................",
  "......KKKK......",
  "....KKCCCCKK....",
  "...KCCCCCCCCK...",
  "..KCCCCCCCCCCK..",
  "..KCCCCCCCCCCK..",
  ".KCCCCCCCCCCCCK.",
  ".KCCCCCCCCCCCCK.",
  ".KCCCCCCCCCCCCK.",
  ".KCCCCCCCCCCCCK.",
  "..KCCCCCCCCCCK..",
  "..KCCCCCCCCCCK..",
  "...KCCCCCCCCK...",
  "....KKCCCCKK....",
  "......KKKK......",
  "................"
];

// shading applied to every face for a little dimension
const SHADE = [
  [3,4,'L'],[3,5,'L'],[4,3,'L'],[4,4,'L'],[5,3,'L'],
  [9,12,'D'],[9,13,'D'],[10,11,'D'],[10,12,'D'],[11,11,'D']
];

const FACES = {
  idle:[
    [6,4,'W'],[6,5,'W'],[7,4,'W'],[7,5,'P'],
    [6,10,'W'],[6,11,'W'],[7,10,'P'],[7,11,'W'],
    [10,7,'K'],[10,8,'K']                       // content smile
  ],
  working:[
    [6,4,'W'],[6,5,'W'],[7,4,'P'],[7,5,'W'],
    [6,10,'W'],[6,11,'W'],[7,10,'W'],[7,11,'P'],
    [10,7,'K'],[10,8,'K'],[11,7,'W'],[11,8,'W']  // little open mouth
  ],
  maxed:[
    [6,4,'K'],[7,5,'K'],                          // strained \  
    [6,11,'K'],[7,10,'K'],                        // strained  /
    [8,3,'R'],[8,12,'R'],                         // blush
    [10,6,'K'],[10,7,'K'],[10,8,'K'],[10,9,'K']   // flat wide mouth
  ],
  offline:[
    [7,4,'K'],[7,5,'K'],[7,10,'K'],[7,11,'K'],    // closed eyes
    [10,7,'K'],[10,8,'K']
  ]
};

function buildMascot(face){
  const grid = BODY.map(r=>r.split(''));
  [...SHADE, ...FACES[face]].forEach(([r,c,ch])=>{ grid[r][c]=ch; });
  const el = document.createElement('div');
  el.className='mascot';
  grid.forEach(row=>row.forEach(ch=>{
    const px=document.createElement('div');
    px.className='px';
    const col=PALETTE[ch];
    if(col) px.style.background=col;
    el.appendChild(px);
  }));
  return el;
}

/* ---------- decorations per state ---------- */
function buildDeco(state){
  const d=document.createElement('div'); d.className='deco';
  if(state.face==='working'){
    [[92,8],[6,30],[84,62]].forEach(([x,y],i)=>{
      const s=document.createElement('div'); s.className='spark';
      s.style.left=x+'px'; s.style.top=y+'px';
      if(i===1){s.style.width='3px';s.style.height='3px';}
      d.appendChild(s);
    });
  }
  if(state.face==='maxed'){
    const dr=document.createElement('div'); dr.className='drop';
    dr.style.left='88px'; dr.style.top='40px';
    d.appendChild(dr);
  }
  if(state.face==='offline'){
    [[86,30,7],[96,18,9],[107,4,11]].forEach(([x,y,sz])=>{
      const z=document.createElement('div'); z.className='z';
      z.textContent='z'; z.style.left=x+'px'; z.style.top=y+'px'; z.style.fontSize=sz+'px';
      d.appendChild(z);
    });
  }
  return d;
}

/* ---------- usage bar ---------- */
function buildBar(label, pct, alert, offline){
  const row=document.createElement('div'); row.className='bar-row';
  const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=label;
  const bar=document.createElement('div'); bar.className='bar';
  const N=12, filled = offline?0:Math.round(pct/100*N);
  for(let i=0;i<N;i++){
    const seg=document.createElement('div'); seg.className='seg';
    if(i<filled){ seg.classList.add('f'); if(alert) seg.classList.add('alert');
      if(!alert && i===filled-1) seg.classList.add('lead'); }
    bar.appendChild(seg);
  }
  const val=document.createElement('div'); val.className='val'+(alert?' alert':'');
  val.textContent = offline?'--':pct+'%';
  row.append(lbl,bar,val);
  return row;
}

/* ---------- one full screen ---------- */
function buildScreen(s){
  const screen=document.createElement('div');
  screen.className='screen'+(s.offline?' off':'');

  const stack=document.createElement('div'); stack.className='stack';

  // header
  const hdr=document.createElement('div'); hdr.className='hdr';
  hdr.innerHTML=`<div class="id"><span class="s">/</span>claudebuddy</div>`;
  const conn=document.createElement('div'); conn.className='conn';
  conn.innerHTML=`<span>${s.connected?'live':'no link'}</span><span class="dot ${s.connected?'on':'off'}"></span>`;
  hdr.appendChild(conn);

  // content
  const content=document.createElement('div'); content.className='content';
  const mw=document.createElement('div'); mw.className='mascot-wrap';
  mw.appendChild(buildMascot(s.face));
  mw.appendChild(buildDeco(s));
  const status=document.createElement('div'); status.className='status';
  if(s.kicker){ const k=document.createElement('div'); k.className='kicker'; k.textContent=s.kicker; status.appendChild(k); }
  const big=document.createElement('div'); big.className='big'+(s.bigTime?' time':''); big.textContent=s.big;
  if(s.bigColor) big.style.color=s.bigColor;
  if(s.bigSize) big.style.fontSize=s.bigSize;
  status.appendChild(big);
  s.subs.forEach(t=>{
    const sub=document.createElement('div'); sub.className='sub'+(t.accent?' accent':'');
    sub.innerHTML=t.html; status.appendChild(sub);
  });
  content.append(mw,status);

  // footer
  const ftr=document.createElement('div'); ftr.className='ftr';
  ftr.appendChild(buildBar('5H', s.h5, s.h5>=90, s.offline));
  ftr.appendChild(buildBar('WK', s.wk, s.wk>=90, s.offline));

  stack.append(hdr,content,ftr);
  screen.appendChild(stack);
  return screen;
}

/* ---------- device + caption ---------- */
function buildCard(s){
  const card=document.createElement('div'); card.className='card';
  const dev=document.createElement('div'); dev.className='device';
  dev.innerHTML=`<span class="led"></span><span class="brand">CORE2</span>
    <div class="touch"><i></i><i></i><i></i></div>`;
  const wrap=document.createElement('div'); wrap.className='screen-wrap';
  wrap.appendChild(buildScreen(s));
  dev.appendChild(wrap);

  const cap=document.createElement('div'); cap.className='caption';
  cap.innerHTML=`<div class="num">${s.num}</div>
    <div class="body"><div class="name">${s.name}</div>
    <div class="desc">${s.desc}</div></div>`;

  card.append(dev,cap);
  return card;
}

/* ============================================================
   THE FOUR STATES
   ============================================================ */
const STATES=[
  {
    num:'01', name:'NOT CONNECTED', face:'offline', connected:false, offline:true,
    big:'OFFLINE',
    subs:[
      {html:'mqtt: <span class="hl">no link</span>'},
      {html:'check broker'}
    ],
    h5:0, wk:0,
    desc:'MQTT link is down. The buddy dims and dozes until the broker comes back \u2014 no data, low contrast, nothing to report.'
  },
  {
    num:'02', name:'MAXED OUT', face:'maxed', connected:true, offline:false,
    kicker:'maxed · back in', bigTime:true, big:'1H 29M', bigColor:'var(--alert)', bigSize:'26px',
    subs:[
      {html:'at <span class="hl">3:00p</span> &middot; 0 left', accent:true}
    ],
    h5:100, wk:84,
    desc:'Token budget is spent. The countdown to the next window is the hero — readable across the room — over a full red bar and a strained little face.'
  },
  {
    num:'03', name:'WORKING', face:'working', connected:true, offline:false,
    big:'WORKING',
    subs:[
      {html:'spending tokens'},
      {html:'<span class="hl">+12.4k</span> this turn', accent:true}
    ],
    h5:58, wk:47,
    desc:'Claude is burning tokens right now. The buddy perks up, sparkles fire, and the 5-hour bar climbs with a bright leading edge.'
  },
  {
    num:'04', name:'IDLE', face:'idle', connected:true, offline:false,
    big:'READY',
    subs:[
      {html:'claude is idle'},
      {html:'waiting\u2026'}
    ],
    h5:33, wk:44,
    desc:'Connected and calm. Content face, steady bars \u2014 everything nominal, just waiting for the next request.'
  }
];

const board=document.getElementById('board');
STATES.forEach(s=>board.appendChild(buildCard(s)));
</script>
</body>
</html>
